name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted publishing: npm exchanges the GitHub OIDC token, no NPM_TOKEN secret needed.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      # `prepare` runs build:all during npm ci.
      - run: npm ci
      - run: npm run typecheck
      # The trusted publisher may only stage: a maintainer then publishes with
      # `npm stage list` and `npm stage approve <stage-id>`, which asks for 2FA.
      # Prereleases (v1.2.0-beta.1) go to the `next` dist-tag so they never become `latest`.
      - run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm stage publish --provenance --access public --tag next ;;
            *) npm stage publish --provenance --access public ;;
          esac
